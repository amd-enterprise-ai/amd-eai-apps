[project]
name = "aiwb-ui-e2e"
version = "0.1.0"
description = "E2E test dependencies for AIWB UI"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "robotframework>=7.4.2",
    "robotframework-browser>=20.2.0",
    "robotframework-requests>=0.9.7",
    "robotframework-jsonlibrary>=0.5",
    "PyJWT>=2.12.0",
    "PyYAML>=6.0.2",
    "kubernetes>=36.0.3",
    "loguru>=0.7.3",
    # Required by the AIWB API specs' AIMModelHelper library, which UI specs reuse
    # for object-storage fixtures; without it the whole library fails to import.
    "minio>=7.2.20",
]
