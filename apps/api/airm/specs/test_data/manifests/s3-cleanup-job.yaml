apiVersion: batch/v1
kind: Job
metadata:
  name: s3-cleanup-test-job
  labels:
    app: s3-cleanup-test
    test-type: storage-e2e
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: s3-cleanup-test
    spec:
      restartPolicy: Never
      containers:
        - name: s3-cleanup
          image: python:3.12-alpine
          env:
            - name: BUCKET_URL
              valueFrom:
                configMapKeyRef:
                  name: STORAGE_CONFIG_MAP_NAME # Will be replaced by Robot
                  key: BUCKET_URL
            - name: ACCESS_KEY_NAME
              valueFrom:
                configMapKeyRef:
                  name: STORAGE_CONFIG_MAP_NAME # Will be replaced by Robot
                  key: ACCESS_KEY_NAME
            - name: SECRET_KEY_NAME
              valueFrom:
                configMapKeyRef:
                  name: STORAGE_CONFIG_MAP_NAME # Will be replaced by Robot
                  key: SECRET_KEY_NAME
            - name: SECRET_NAME
              valueFrom:
                configMapKeyRef:
                  name: STORAGE_CONFIG_MAP_NAME # Will be replaced by Robot
                  key: SECRET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: SECRET_NAME_PLACEHOLDER # Will be replaced by Robot
                  key: ACCESS_KEY_NAME_PLACEHOLDER # Will be replaced by Robot
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: SECRET_NAME_PLACEHOLDER # Will be replaced by Robot
                  key: SECRET_KEY_NAME_PLACEHOLDER # Will be replaced by Robot
            # Key prefix of the e2e test objects to delete
            - name: TEST_DATA_PREFIX
              value: "PLACEHOLDER" # Will be replaced by Robot
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== S3 Cleanup Test Job ==="
              echo "Installing boto3..."
              pip install -q boto3

              echo "Cleaning up e2e test data from S3..."
              python3 <<'EOF'
              import os
              import boto3
              from urllib.parse import urlparse

              # Parse bucket URL
              bucket_url = os.environ['BUCKET_URL']
              parsed = urlparse(bucket_url)
              bucket_name = parsed.path.lstrip('/')
              endpoint_url = f"{parsed.scheme}://{parsed.netloc}"

              print(f"Bucket: {bucket_name}")
              print(f"Endpoint: {endpoint_url}")
              print(f"Prefix to delete: {os.environ['TEST_DATA_PREFIX']}")

              # Create S3 client
              s3 = boto3.client(
                  's3',
                  endpoint_url=endpoint_url,
                  aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
                  aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
                  region_name='us-east-1'
              )

              # List only the objects owned by this test. An empty prefix would mean every object
              # in the bucket, so refuse it before making any S3 call.
              prefix = os.environ['TEST_DATA_PREFIX']
              prefix_parts = prefix.removeprefix('e2e-test-storage-').removesuffix('/').split('-')
              safe_prefix = (
                  prefix.startswith('e2e-test-storage-')
                  and prefix.endswith('/')
                  and len(prefix_parts) == 2
                  and prefix_parts[0].isdigit()
                  and len(prefix_parts[1]) == 12
                  and all(char in '0123456789abcdef' for char in prefix_parts[1])
              )
              if not safe_prefix:
                  raise SystemExit(
                      f"Refusing to delete with an unsafe S3 key prefix: {prefix!r}"
                  )

              # Every direct-S3 test creates its own e2e-test-bucket-* bucket. This generic Job
              # deletes a bucket only when its name proves that it follows that test convention;
              # anything else may be platform- or user-owned.
              delete_bucket = bucket_name.startswith('e2e-test-bucket-')

              # This Job reports truthfully and lets every real error fail it. Keeping cleanup
              # non-fatal for the test is the caller's job -- the Robot keyword wraps this in
              # TRY/EXCEPT and downgrades a failure to a warning. Swallowing errors here too
              # would leave no layer able to say the objects were never deleted.

              # Paginate: a single list call returns at most 1000 keys, so a caller that passes a
              # broad prefix would otherwise have only its first page deleted and still be told
              # the cleanup succeeded.
              objects_to_delete = []
              try:
                  for page in s3.get_paginator('list_objects_v2').paginate(
                      Bucket=bucket_name, Prefix=prefix
                  ):
                      objects_to_delete.extend(
                          {'Key': obj['Key']} for obj in page.get('Contents') or []
                      )
              except s3.exceptions.NoSuchBucket:
                  # Nothing was ever written here, so there is nothing to clean up.
                  print(f"Bucket {bucket_name} does not exist - nothing to clean up")
                  raise SystemExit(0)

              if objects_to_delete:
                  print(f"Found {len(objects_to_delete)} objects to delete:")
                  for obj in objects_to_delete[:20]:
                      print(f"  - {obj['Key']}")
                  if len(objects_to_delete) > 20:
                      print(f"  ... and {len(objects_to_delete) - 20} more")

                  # delete_objects also caps at 1000 keys per request.
                  errors = []
                  for start in range(0, len(objects_to_delete), 1000):
                      result = s3.delete_objects(
                          Bucket=bucket_name,
                          Delete={'Objects': objects_to_delete[start:start + 1000]}
                      )
                      # A per-key failure is reported in the response body, not raised.
                      errors.extend(result.get('Errors') or [])

                  if errors:
                      for err in errors[:20]:
                          print(f"  ! {err.get('Key')}: {err.get('Code')} {err.get('Message')}")
                      raise SystemExit(
                          f"Failed to delete {len(errors)} of {len(objects_to_delete)} objects"
                      )

                  print(f"✓ Successfully deleted {len(objects_to_delete)} test objects")
              else:
                  print(f"No objects found with prefix '{prefix}'")

              if delete_bucket:
                  # The writer creates a new bucket for this test, so it contains no unrelated
                  # data. Delete it even when the write failed before creating an object.
                  s3.delete_bucket(Bucket=bucket_name)
                  print(f"✓ Successfully deleted test bucket {bucket_name}")
              EOF

              echo "=== S3 Cleanup Complete ==="
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
