apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: e2e-test-secret
spec:
  # Short on purpose. external-secrets only retries a failed sync on this interval, so at 1h a
  # first attempt that loses a race with the secret store never recovers inside the couple of
  # minutes a test waits for the storage to reach Synced — the storage suite failed
  # intermittently that way, with the ExternalSecret sitting in SyncedError. Production
  # ExternalSecrets pick their own interval; nothing here asserts this value.
  refreshInterval: 10s
  secretStoreRef:
    name: openbao-secret-store
    kind: ClusterSecretStore
  target:
    name: e2e-test-secret
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: minio-api-access-key
        property: value
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: minio-api-secret-key
        property: value
