repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: airm-api-test
        name: AIRM API tests
        entry: bash -c 'uv run pytest -x'
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true
        fail_fast: true
