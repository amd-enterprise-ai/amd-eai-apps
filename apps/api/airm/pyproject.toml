[project]
name = "api"
version = "0.1.0"
description = "AMD Resource Manager API"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "api_common",
    "asyncpg~=0.30.0",
    "fastapi>=0.115.12",
    "fastapi-mcp>=0.4.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "prometheus-api-client>=0.5.7",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.2.2",
    "python-keycloak>=5.5.0",
    "sqlalchemy[asyncio]~=2.0.36",
    "uvicorn[standard]>=0.34.0",
    # Floor holds the CVE-2026-48710 fix: a re-resolve must not drop below it.
    # Declared directly because airm otherwise depends on starlette only
    # transitively, where nothing stops a re-resolve picking a vulnerable version.
    "starlette>=1.3.1",
    # Anything below 8.0.1 crashes resolving a route name for any nested route once
    # FastAPI starts wrapping included routers in a lazy object with no `path`.
    # The floor is 8.1.0 rather than 8.0.1 because 8.0.1 unwrapped those objects with
    # a prefix-stripping heuristic that 8.1.0 replaced with FastAPI's own route
    # contexts, fixing nested-app corner cases. This app mounts a sub-application.
    # 8.x also requires starlette >=1.0, whereas 7.1.0 pins starlette <1.0.0 and
    # would let a re-resolve undo the starlette floor above.
    "prometheus-fastapi-instrumentator>=8.1.0",
    "aio-pika>=9.5.5",
]

[tool.uv.sources]
api_common = { path = "../api_common", editable = true }

[dependency-groups]
dev = [
    "async-asgi-testclient>=1.4.11",
    "coverage>=7.8.0",
    "debugpy>=1.8.0",
    "docker>=7.1.0",
    "filelock>=3.0.0",
    # Starlette 1.x's TestClient prefers httpx2 and warns when only httpx 0.x is
    # present. That warning is a StarletteDeprecationWarning, which subclasses
    # UserWarning rather than DeprecationWarning, so pytest.ini's
    # `ignore::DeprecationWarning` does not cover it and `error` turns it into a
    # collection failure. Removing this dependency breaks the whole suite.
    # The floor is kept in sync with tests/test_testclient_dependency.py.
    "httpx2>=2.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.1.1",
    "testcontainers[postgres,rabbitmq]>=4.14.0",
    "pytest-env>=1.1.5",
    "pytest-httpx>=0.35.0",
    "pytest-xdist>=3.6.0",
    "pytest-loguru>=0.4.0",
    "responses>=0.25.7",
    "types-docker>=7.1.0.20250705",
    # Floor matches tooling/rf_dryrun_cache.py's supported range: this app's
    # dry-run gate loads that listener, and below 7.4 it refuses to install.
    "robotframework>=7.4",
    "robotframework-requests>=0.9.7",
    "requests>=2.32.3",
    "certifi>=2025.1.31",
    "PyJWT>=2.12.0",
    "tenacity>=9.1.2",
]
