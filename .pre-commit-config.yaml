# Common repo-wide hooks (whitespace, shellcheck, prettier, mypy).
# App-specific hooks live in per-app configs under apps/*/, discovered by prek as nested
# workspace projects. Those configs must never declare `orphan: true`: an orphan project
# consumes its own files instead of passing them up, so every hook here would report
# "no files to check" for anything under it and the repo-wide checks would silently stop
# covering that tree. Per-project file scoping already keeps one app's hooks off another's
# files, which is all orphan was ever wanted for.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(apps/api/workloads_manager/workloads_manager/data/patches|sbom\.json|THIRD-PARTY-NOTICES\.md)
      - id: end-of-file-fixer
        exclude: ^(sbom\.json|THIRD-PARTY-NOTICES\.md)$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
        args: ["--write", "--config", ".prettierrc"]
        exclude: ^(apps/ui|docs|helm/.*.yaml|.github/workflows/.*.yml|apps/api/.*/specs/test_workloads|sbom\.json|THIRD-PARTY-NOTICES\.md)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-redis,
            types-PyYAML,
            types-requests,
            types-tabulate,
            types-docker,
          ]
        args: ["--config-file=pyproject.toml"]
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
