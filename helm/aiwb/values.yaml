---
# Default values for AIWB (AI Workbench)

# Standalone mode: true or false
# true: AIWB is scoped to a single namespace. It creates and manages this namespace,
#   along with its Kyverno policies and secrets. The API rejects requests for any other
#   namespace because there is no group-based authorization to verify access outside
#   the managed namespace.
# false: AIRM manages namespaces, policies, and secrets. Users can access multiple
#   project namespaces based on their JWT group claims.
standAloneMode: false

# Name of the namespace to create and scope to (only used when standAloneMode: true).
# All AIWB resources (AIMs, workloads, workspaces, datasets) will be confined to this namespace.
defaultNamespace: "workbench"

# Full URL override for AIRM UI (cross-app navigation).
# If empty, auto-constructed as https://{gateway.airm.prefixValue}.{appDomain}.
# Only used when standAloneMode is false.
airmAppUrl: ""

# Metadata prefixes for labels and annotations on Kubernetes resources
metadataPrefix:
  # EAI Apps prefix for workload identification (workload-id, project-id labels)
  # TODO: Will change to "apps.eai.amd.com" in the future
  eaiApps: "airm.silogen.ai"
  # AIWB prefix for AIWB-specific labels and annotations (e.g., creator)
  aiwb: "aiwb.apps.eai.amd.com"

# Application domain (base domain for all services)
appDomain: PUBLIC-IP

# Gateway configuration for HTTPRoute resources
gateway:
  namespace: envoy-gateway-system
  gatewayName: https
  api:
    servicePort: 8080
    prefixValue: aiwbapi
    timeouts:
      stream:
        backendRequest: 30m
        request: 30m
      nonStream:
        backendRequest: 10m
        request: 10m
  ui:
    servicePort: 8000
    prefixValue: aiwbui
    timeouts:
      backendRequest: 1m
      request: 1m
  keycloak:
    prefixValue: kc
  airm:
    prefixValue: airmui

# Deprecated: renamed to gateway.namespace / gateway.gatewayName.
# If set, these values take precedence for backwards compatibility.
kgateway:
  namespace: ""
  gatewayName: ""

# Backend (API) configuration
backend:
  # Cluster host for external URLs (e.g., https://workloads.<your-domain>)
  # If not set, defaults to https://workloads.{appDomain}
  clusterHost: ""
  # Host for interactive workspace external URLs (e.g., https://workspaces.<your-domain>)
  # If not set, defaults to https://workspaces.{appDomain}
  workspacesHost: ""
  image:
    repository: amdenterpriseai/aiwb-api
    tag: ""
    pullPolicy: IfNotPresent
  # NOTE: AIWB currently only supports 1 replica due to the poller/syncer setup.
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  imagePullSecrets: []
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Polling Intervals (seconds)
  polling:
    syncerPollingIntervalSeconds: 5
    syncerPendingTimeoutSeconds: 60
  # Reclaim the object storage, API keys and credentials a deleted project leaves behind.
  # Opt-in: what it removes cannot be restored, and it decides what is abandoned by comparing
  # timestamps, so it is for an operator to enable deliberately. Left disabled, nothing is
  # scheduled.
  deletedProjectCleanup:
    enabled: false
    intervalSeconds: 3600
    # Data is only credited to a previous holder of a project name once it predates that name's
    # current namespace by this much. It guards a comparison between the API pod's clock and the
    # Kubernetes API server's, so raise it where those may drift; lowering it makes reclamation
    # quicker to act after a name is reused, and quicker to get that wrong.
    skewMarginSeconds: 3600
  # Dataset Configuration
  datasets:
    maxFileSizeMB: 100
  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Frontend (UI) configuration
frontend:
  image:
    repository: amdenterpriseai/aiwb-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
    targetPort: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 512Mi
  imagePullSecrets: []
  nextAuthSecretName: "aiwb-nextauth-secret"

# OIDC login. Any issuer works. An empty value derives from the keycloak block
# below, so an installation with Keycloak needs no change here.
oidc:
  # The public issuer URL: the browser goes there, and the tokens carry it as
  # `iss`. Example: https://auth.example.com
  issuer: ""
  # The issuer URL as the Pods reach it, when the public name does not resolve
  # inside the cluster. Example: http://dex.dex.svc.cluster.local:5556
  internalUrl: ""
  clientId: ""
  # Secret in the release namespace with the client secret under the key `value`.
  secretName: ""
  # The JWKS URL as the API reaches it. Required when issuer or internalUrl
  # is set, because the chart knows the JWKS path of Keycloak only.
  jwksUrl: ""
  # The audience the API requires in the access token. Empty: not checked.
  audience: ""
  # Groups of the token's `groups` claim whose members are Platform Administrators,
  # for an issuer that emits no Keycloak realm roles. Requires audience. Empty: only
  # the Keycloak realm role grants it. Example: ["platform-admins"]
  adminGroups: []
  # The scopes the UI asks for. Empty: "openid profile email".
  scopes: ""

# Keycloak as the OIDC issuer. Gives the defaults of the oidc block.
keycloak:
  url: "http://keycloak.keycloak.svc.cluster.local:8080"
  internalUrl: "http://keycloak.keycloak.svc.cluster.local:8080"
  realm: "airm"
  clientId: "354a0fa1-35ac-4a6d-9c4d-d661129c2cd0"
  secretName: "aiwb-ui-keycloak-secret"

# MinIO (or compatible S3 object storage provider) configuration
minio:
  url: "http://filer-s3.seaweedfs-instance.svc.cluster.local:80"
  # Signs presigned URLs for callers outside the cluster, which cannot resolve the service name
  # above. Defaults to the seaweed.<appDomain> convention the SeaweedFS environments publish.
  # Set it explicitly on any other object store -- no chart here creates that route.
  externalUrl: ""
  bucket: "default-bucket"
  credentialsSecretName: "minio-credentials"
  accessKeyKey: "minio-access-key"
  secretKeyKey: "minio-secret-key"

# SECURITY: with cluster-auth removed, this chart no longer applies any access control to AIM
# serving routes. Per-AIM inference routes on the workloads host are UNAUTHENTICATED unless the
# workloads gateway is separately configured default-deny with per-model API-key auth. Do not
# deploy this to an environment lacking that gateway-side enforcement.
# TODO: drop this note once native workloads-path apiKeyAuth enforcement is in place.

# API-keys feature flag. Gates the API-keys page/menu in the UI. The page also
# hides when openBao.enabled is false, because there is no key store then.
apiKeysManagement:
  enabled: true

# OpenBao/ESO API-key store — the sole API-key path.
openBao:
  # Install-time choice. With enabled false the chart renders no OpenBao
  # configuration and needs no token Secret; the API refuses to create, rebind
  # or delete API keys and the UI hides the API-key page. Do not disable it on
  # an installation that already has API keys: the API refuses to start until
  # the keys are deleted with OpenBao enabled. Set openbaoToken.enabled in the
  # aiwb-external-secrets chart to the same value.
  enabled: true
  url: "http://openbao.cf-openbao.svc.cluster.local:8200"
  kvMount: "secrets"
  secretStoreRef: "openbao-secret-store"
  # k8s Secret (AIWB namespace) holding the scoped write token (apikeys-write-policy), materialized
  # by the aiwb-external-secrets chart from the cluster-forge-minted secrets/aiwb-openbao-token.
  secretName: "aiwb-openbao-token"
  secretKey: "value"

# AI Gateway feature flag.
# When enabled, the API key metrics view is shown in the UI (the chart icon
# action in the API keys table, and the per-key metrics detail page).
# Set to true on clusters where ai-gateway-discovery is installed.
aiGateway:
  enabled: true
  # Base URL of the unified Envoy AI Gateway inference endpoint. The connect
  # modal shows inference examples targeting this single endpoint (the model is
  # selected via the OpenAI `model` field) instead of the per-service external URL.
  # When left empty it defaults to "https://ai.<appDomain>" (rendered by the
  # chart), which matches the ai.<domain> hostname the ai-gateway-discovery
  # controller stamps on its routes — so inference traffic resolves without any
  # extra config. Set it explicitly only to override that default.
  url: ""

# Prometheus configuration (for metrics queries)
prometheus:
  url: "http://lgtm-stack.otel-lgtm-stack.svc.cluster.local:9090"
  # AI Gateway Prometheus metric names (OTel GenAI semantic conventions by default).
  # Override if using a different AI gateway or collector that emits different metric names.
  aiGwTokenUsageMetric: "gen_ai_client_token_usage_sum"
  aiGwRequestDurationMetric: "gen_ai_server_request_duration_seconds_count"

# AIM Configuration
# A cluster-scoped AIMClusterRuntimeConfig is always created by this chart.
# Named "default" so the AIM operator applies it automatically to all AIMServices,
# including those created via kubectl without an explicit runtimeConfigName.
aim:
  clusterRuntimeConfigName: "default"
  pvcHeadroomPercent: 100
  # Runtime fallbacks the AIM operator uses to generate profiles for
  # modelId-backed models on matching cluster hardware; image-backed catalog
  # models never consult them. Set to [] to generate no fallback profiles.
  profileGenerationFallbacks:
    - name: nvidia-vllm
      priority: 10
      type: unoptimized
      autoSelectionPolicy: any
      match:
        acceleratorVendor: nvidia
        acceleratorType: gpu
      runtime:
        image: vllm/vllm-openai:v0.17.1-cu130
        engine: vllm
        engineArgs:
          max-model-len: 8192
          gpu-memory-utilization: 0.9
  routing:
    enabled: true
    # Request timeout applied to every generated AIM serving HTTPRoute (pinned to
    # the hostnames below, which default to workloads.<appDomain>). Sized for
    # long-running inference including batch speech-to-text transcription, which
    # can run far longer than a chat completion.
    # Multipart audio uploads stream through this route — the workloads ext_authz
    # authorizes on the request path and never buffers the body — so this timeout,
    # not a request-body-size buffer, is the ceiling that matters for large audio
    # requests. A hard per-route upload-size cap would have to live on the
    # AIM-engine-generated route itself; see the routing notes in helm/INSTALL.md.
    requestTimeout: "30m"
    # Hostnames to pin generated inference HTTPRoutes to a single Gateway
    # listener, preventing them from attaching to every listener on the parent
    # gateway (which would expose the service on listeners that do not enforce
    # inference auth). Required on a multi-listener gateway: without a hostname
    # the AIM operator refuses to create the route (ConfigValid=False /
    # RouteHostnameRequired). If left empty, the chart defaults to
    # workloads.<appDomain>.
    hostnames: []

# PostgreSQL CNPG Configuration
postgresql:
  host: "aiwb-infra-cnpg-cnpg-rw.aiwb.svc.cluster.local"
  port: 5432
  database: "aiwb"
  username: "aiwb_user"
  userSecretName: "aiwb-cnpg-user"

# OpenTelemetry Collector Configuration (for vLLM metrics)
otelCollector:
  image: "otel/opentelemetry-collector-contrib:0.114.0"
  scrapeInterval: "30s"
  endpoint: "http://lgtm-stack.otel-lgtm-stack.svc.cluster.local:4318"

# Ingress configuration (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aiwb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# RBAC configuration
rbac:
  serviceAccountName: "aiwb"
