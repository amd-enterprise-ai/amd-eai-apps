{{- $labelPrefixUnderscore := replace "." "_" (replace "/" "_" .Values.metadataPrefix.eaiApps) }}
{{- $collectorName := printf "%s-vllm-otel" (include "aiwb.fullname" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiwb.fullname" . }}-otel-collector-pod-reader
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiwb.fullname" . }}-otel-collector-pod-reader
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiwb.fullname" . }}-otel-collector-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ $collectorName }}-collector
    namespace: {{ .Release.Namespace }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ $collectorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
spec:
  mode: daemonset
  image: {{ .Values.otelCollector.image }}
  # Expose the node this collector pod runs on, so the scrape config can keep only
  # node-local pods (see the node_name relabel below).
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # Run only on nodes with an AIM inference accelerator — GPU or a supported EPYC — so
  # the collector isn't scheduled on generic/CPU-only or control-plane nodes.
  # NOTE: aim-accelerator.CPU is written on *every* node by the CPU detector (a generic
  # per-node label — e.g. GPU nodes carry it too), so it can't be used here. GPU nodes
  # carry a generic aim-accelerator.GPU, but there is no generic aim-accelerator.EPYC
  # yet, so EPYC generations/SKUs are enumerated below. A generic EPYC label should
  # replace this list. nodeSelectorTerms are OR-ed.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.GPU
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_ZEN4
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_ZEN5
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_9175F
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_9575F
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_9655
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_9755
                operator: Exists
          - matchExpressions:
              - key: feature.node.kubernetes.io/aim-accelerator.EPYC_9965
                operator: Exists
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: "vllm"
              metrics_path: /metrics
              scrape_interval: {{ .Values.otelCollector.scrapeInterval | quote }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # DaemonSet: only scrape pods on this collector's own node, so each pod is
                # scraped exactly once (no N-way duplication across the fleet of collectors).
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${env:NODE_NAME}
                # Only scrape pods with the workload-id label
                - source_labels:
                    [__meta_kubernetes_pod_label_{{ $labelPrefixUnderscore }}_workload_id]
                  action: keep
                  regex: .+
                # Only scrape pods with app label starting with isvc.
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: isvc\..*
                # Set the workload_id from the label
                - source_labels:
                    [__meta_kubernetes_pod_label_{{ $labelPrefixUnderscore }}_workload_id]
                  target_label: workload_id
                # Set the project_id from the label
                - source_labels:
                    [__meta_kubernetes_pod_label_{{ $labelPrefixUnderscore }}_project_id]
                  target_label: project_id
                # Set service name from app label
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: service
                # Set service instance id from pod name
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: service_instance_id
                # Set the scrape target to port 8000
                - source_labels: [__meta_kubernetes_pod_ip]
                  target_label: __address__
                  replacement: $1:8000
      otlp:
        protocols:
          grpc: {}
          http: {}

    processors:
      resource:
        attributes:
          - key: {{ .Values.metadataPrefix.eaiApps }}/workload-id
            from_attribute: workload_id
            action: upsert
          - key: {{ .Values.metadataPrefix.eaiApps }}/project-id
            from_attribute: project_id
            action: upsert
          - key: service.instance.id
            from_attribute: service_instance_id
            action: upsert
          - key: service.name
            from_attribute: service
            action: upsert

      transform:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["workload_id"], resource.attributes["{{ .Values.metadataPrefix.eaiApps }}/workload-id"]) where attributes["workload_id"] == nil
              - set(attributes["project_id"], resource.attributes["{{ .Values.metadataPrefix.eaiApps }}/project-id"]) where attributes["project_id"] == nil
              - set(attributes["service_instance_id"], resource.attributes["service.instance.id"]) where attributes["service_instance_id"] == nil
              - set(attributes["service"], resource.attributes["service.name"]) where attributes["service"] == nil

    exporters:
      otlphttp:
        endpoint: {{ .Values.otelCollector.endpoint | quote }}

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [resource, transform]
          exporters: [otlphttp]

        traces:
          receivers: [otlp]
          processors: [resource]
          exporters: [otlphttp]

        logs:
          receivers: [otlp]
          processors: [resource]
          exporters: [otlphttp]
