---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiwb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiwb.fullname" . }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
rules:
# AIM CRD access.
- apiGroups: ["aim.eai.amd.com"]
  resources: ["aimservices", "aimclustermodels", "aimclusterprofiles", "aimprofiles", "aimprofilesets", "aimprofilecaches", "aimruntimeconfigs", "aimclusterruntimeconfigs", "aimmodels", "aimartifacts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Kubernetes Secret access (on-demand reads, no database persistence)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Per-backend ExternalSecrets for the API-key store (ESO materializes the labelled Secrets;
# AIWB only manages the ExternalSecret binding list).
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Namespace access (for namespace discovery)
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# ConfigMap access (for workload configuration)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

# Pod access (for workload status and cleanup)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

# Deployment access (for workload management)
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]

# Service access (for workload management)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

# Events access (for resource status monitoring)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

# Node access (for cluster resource metrics)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

# Job access (for batch workloads)
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]

# Kaiwo workload wrappers. This grant is defensive, not part of the normal path: AIWB
# patches every chart it registers to set kaiwo.enabled=false, so a correctly patched
# install renders a plain Deployment/Job and never touches these kinds. But the chart
# signature is persisted per deployment, and manifests are applied kind-agnostically, so
# a chart that reaches the cluster with kaiwo.enabled still true renders a
# KaiwoService/KaiwoJob — and without this rule the 403 surfaces to the caller as a 500.
- apiGroups: ["kaiwo.silogen.ai"]
  resources: ["kaiwojobs", "kaiwoservices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]

# CRD access (for dynamic resource queries)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

# Ingress access (for chart-workloads networking)
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

# Gateway API HTTPRoute access (for chart-workloads networking)
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]

# KServe InferenceService access (for deriving internal endpoints)
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  verbs: ["get", "list"]

# Kueue ClusterQueue and LocalQueue access (for reading project GPU quotas)
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues"]
  verbs: ["get"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["localqueues"]
  verbs: ["list"]

# PVC access (read-only)
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]

# ServiceAccount management (for finetuning job aimmodel-applier sidecar RBAC)
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "create", "delete", "deletecollection"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "create", "delete", "deletecollection"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiwb.fullname" . }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiwb.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "aiwb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
