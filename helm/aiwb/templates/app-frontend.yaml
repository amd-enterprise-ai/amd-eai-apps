---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: "{{ .Release.Name }}-ui"
  name: "{{ .Release.Name }}-ui"
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: web
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
  selector:
    app: "{{ .Release.Name }}-ui"
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-ui"
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-ui"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-ui"
    spec:
      {{- with .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aiwb-ui
          env:
            - name: NEXTAUTH_URL
              value: "https://{{ .Values.gateway.ui.prefixValue }}.{{ .Values.appDomain }}"
            - name: OIDC_ISSUER
              value: {{ include "aiwb.oidcIssuer" . | quote }}
            - name: OIDC_ISSUER_INTERNAL_URL
              value: {{ include "aiwb.oidcInternalUrl" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ include "aiwb.oidcClientId" . | quote }}
            {{- with .Values.oidc.scopes }}
            - name: OIDC_SCOPES
              value: {{ . | quote }}
            {{- end }}
            - name: AIRM_API_SERVICE_URL
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.service.port }}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.frontend.nextAuthSecretName }}"
                  key: NEXTAUTH_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiwb.oidcSecretName" . | quote }}
                  key: value
            - name: STANDALONE_MODE
              value: {{ if .Values.standAloneMode }}"true"{{ else }}"false"{{ end }}
            - name: DEFAULT_NAMESPACE
              value: {{ .Values.defaultNamespace | quote }}
            - name: API_KEYS_MANAGEMENT_ENABLED
              value: {{ and .Values.apiKeysManagement.enabled .Values.openBao.enabled | quote }}
            - name: AI_GATEWAY_ENABLED
              value: {{ .Values.aiGateway.enabled | quote }}
            - name: AI_GATEWAY_URL
              value: {{ .Values.aiGateway.url | default (printf "https://ai.%s" .Values.appDomain) | quote }}
            {{- if not .Values.standAloneMode }}
            - name: AIRM_APP_URL
              value: {{ include "aiwb.airmAppUrl" . | quote }}
            {{- end }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: "{{ .Values.frontend.image.pullPolicy }}"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.frontend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
