---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: "{{ .Release.Name }}-api"
  name: "{{ .Release.Name }}-api"
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: web
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
  selector:
    app: "{{ .Release.Name }}-api"
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-api"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiwb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-api"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-api"
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aiwb.serviceAccountName" . }}
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.postgresql.userSecretName }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ .Values.postgresql.userSecretName }}
          command:
            - sh
            - -c
            - |
              until psql -h "{{ .Values.postgresql.host }}" -p {{ .Values.postgresql.port }} \
                    -U "$DATABASE_USER" -d "{{ .Values.postgresql.database }}" -c "SELECT 1" > /dev/null 2>&1; do
                echo "Waiting for database user to be available..."
                sleep 3
              done
              echo "Database is ready!"
        - name: init-migration-scripts
          command:
            - sh
            - -c
            - cp /code/migrations/* /mnt/code/migrations/
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /mnt/code/migrations
              name: aiwb-migration-volume
        - name: liquibase-migrate
          command:
            - liquibase
            - --url=jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}
            - --username=$(DATABASE_USER)
            - --password=$(DATABASE_PASSWORD)
            - --logLevel=INFO
            - --changeLogFile=changelog/changelog.xml
            - update
          env:
            - name: DATABASE_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.userSecretName }}
                  key: password
          image: docker.io/liquibase/liquibase:4.31
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /liquibase/changelog
              name: aiwb-migration-volume
              readOnly: true
        - name: charts-registration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uv", "run", "register-charts"]
          env:
            - name: DATABASE_HOST
              value: {{ .Values.postgresql.host | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DATABASE_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.userSecretName }}
                  key: password
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
      containers:
      - name: aiwb
        securityContext:
          {{- toYaml .Values.backend.securityContext | nindent 10 }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        env:
        # Database configuration
        - name: DATABASE_HOST
          value: {{ .Values.postgresql.host | quote }}
        - name: DATABASE_PORT
          value: {{ .Values.postgresql.port | quote }}
        - name: DATABASE_NAME
          value: {{ .Values.postgresql.database | quote }}
        - name: DATABASE_USER
          value: {{ .Values.postgresql.username | quote }}
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.userSecretName }}
              key: password

        # OIDC configuration. OPENID_* serve the Swagger UI login, OIDC_* the
        # token check.
        - name: OPENID_CLIENT_ID
          value: {{ include "aiwb.oidcClientId" . | quote }}
        - name: OPENID_CONFIGURATION_URL
          value: "{{ include "aiwb.oidcIssuer" . }}/.well-known/openid-configuration"
        - name: OIDC_JWKS_URL
          value: {{ include "aiwb.oidcJwksUrl" . | quote }}
        - name: OIDC_ISSUER
          value: {{ include "aiwb.oidcIssuer" . | quote }}
        - name: OIDC_AUDIENCE
          value: {{ .Values.oidc.audience | quote }}

        # MinIO configuration
        - name: MINIO_URL
          value: {{ .Values.minio.url | quote }}
        - name: MINIO_EXTERNAL_URL
          value: {{ .Values.minio.externalUrl | default (printf "https://seaweed.%s" .Values.appDomain) | quote }}
        - name: MINIO_BUCKET
          value: {{ .Values.minio.bucket | quote }}
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.minio.credentialsSecretName }}
              key: {{ .Values.minio.accessKeyKey }}
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.minio.credentialsSecretName }}
              key: {{ .Values.minio.secretKeyKey }}
        # The backend emits this Secret name and these key names into AIMArtifact/AIMModel
        # secretKeyRefs, so they must match the Secret the env vars above bind from.
        - name: MINIO_CREDENTIALS_SECRET_NAME
          value: {{ .Values.minio.credentialsSecretName | quote }}
        - name: MINIO_CREDENTIALS_ACCESS_KEY_KEY
          value: {{ .Values.minio.accessKeyKey | quote }}
        - name: MINIO_CREDENTIALS_SECRET_KEY_KEY
          value: {{ .Values.minio.secretKeyKey | quote }}
        - name: MINIO_MAX_ATTEMPTS
          value: "3"
        - name: MINIO_MIN_WAIT
          value: "4"
        - name: MINIO_MAX_WAIT
          value: "60"

        # OpenBao/ESO store — the sole API-key path. OPENBAO_TOKEN is the
        # scoped apikeys-write-policy token materialized by the aiwb-external-secrets chart.
        # Without OpenBao the API gets an empty address and no token, so it builds no client.
        # With OpenBao enabled the token reference is deliberately not optional: a missing
        # Secret means openbaoToken.enabled in the aiwb-external-secrets release disagrees with
        # this value, and the Pod must fail at start rather than run without its key store.
        {{- if .Values.openBao.enabled }}
        - name: OPENBAO_ADDR
          value: {{ .Values.openBao.url | quote }}
        - name: OPENBAO_KV_MOUNT
          value: {{ .Values.openBao.kvMount | quote }}
        - name: OPENBAO_SECRET_STORE_REF
          value: {{ .Values.openBao.secretStoreRef | quote }}
        - name: OPENBAO_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.openBao.secretName }}
              key: {{ .Values.openBao.secretKey }}
        {{- else }}
        - name: OPENBAO_ADDR
          value: ""
        {{- end }}

        # Prometheus configuration
        - name: PROMETHEUS_URL
          value: {{ .Values.prometheus.url | quote }}
        - name: AI_GW_TOKEN_USAGE_METRIC
          value: {{ .Values.prometheus.aiGwTokenUsageMetric | quote }}
        - name: AI_GW_REQUEST_DURATION_METRIC
          value: {{ .Values.prometheus.aiGwRequestDurationMetric | quote }}

        # Kubernetes configuration
        - name: USE_LOCAL_KUBE_CONTEXT
          value: "false"
        - name: STANDALONE_MODE
          value: {{ .Values.standAloneMode | quote }}
        - name: DEFAULT_NAMESPACE
          value: {{ .Values.defaultNamespace | quote }}

        # Syncer Configuration
        - name: SYNCER_POLLING_INTERVAL_SECONDS
          value: {{ .Values.backend.polling.syncerPollingIntervalSeconds | quote }}
        - name: SYNCER_PENDING_TIMEOUT_SECONDS
          value: {{ .Values.backend.polling.syncerPendingTimeoutSeconds | quote }}

        # Reclaiming data left behind by deleted projects. Off unless an operator turns it on:
        # what it deletes cannot be restored. Disabled, nothing is scheduled.
        - name: DELETED_PROJECT_CLEANUP_ENABLED
          value: {{ .Values.backend.deletedProjectCleanup.enabled | quote }}
        - name: DELETED_PROJECT_CLEANUP_INTERVAL_SECONDS
          value: {{ .Values.backend.deletedProjectCleanup.intervalSeconds | quote }}
        - name: DELETED_PROJECT_CLEANUP_SKEW_MARGIN_SECONDS
          value: {{ .Values.backend.deletedProjectCleanup.skewMarginSeconds | quote }}

        # Dataset Configuration
        - name: MAX_FILE_SIZE_MB
          value: {{ .Values.backend.datasets.maxFileSizeMB | quote }}

        # AIM Configuration
        - name: AIM_CLUSTER_RUNTIME_CONFIG_NAME
          value: {{ .Values.aim.clusterRuntimeConfigName | quote }}
        - name: AIM_GATEWAY_NAMESPACE
          value: {{ coalesce .Values.kgateway.namespace .Values.gateway.namespace | quote }}
        - name: AIM_GATEWAY_NAME
          value: {{ coalesce .Values.kgateway.gatewayName .Values.gateway.gatewayName | quote }}
        - name: CLUSTER_HOST
          value: {{ .Values.backend.clusterHost | default (printf "https://workloads.%s" .Values.appDomain) | quote }}
        - name: WORKSPACES_HOST
          value: {{ .Values.backend.workspacesHost | default (printf "https://workspaces.%s" .Values.appDomain) | quote }}

        # Metadata prefixes for labels and annotations
        - name: EAI_APPS_METADATA_PREFIX
          value: {{ .Values.metadataPrefix.eaiApps | quote }}
        - name: AIWB_METADATA_PREFIX
          value: {{ .Values.metadataPrefix.aiwb | quote }}

        livenessProbe:
          httpGet:
            path: /v1/health
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      volumes:
        - name: aiwb-migration-volume
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
